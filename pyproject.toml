[project]
name = "mancala"
version = "0.1.0"
description = "環のマンカラ（TDD 練習）"
readme = "README.md"
authors = [
    { name = "yattom", email = "tsutomu.yasui@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2 days"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
